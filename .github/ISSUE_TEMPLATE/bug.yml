name: Bug
description: Something is broken or renders wrong
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the exact command and the error output or a description of the visual or audio problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands from a clean clone, the lesson config or package used, and the quality flag.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Fix is done when
      description: Testable criteria. A regression test that would have caught this bug is always one of them.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "macOS 15, Python 3.11, Manim 0.19.0"
